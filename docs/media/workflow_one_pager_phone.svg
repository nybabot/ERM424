<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 980" width="100%" role="img" aria-labelledby="title desc" lang="en">
<title id="title">The risk analytics workflow</title>
<desc id="desc">The risk analytics workflow. From raw operational data to a risk decision, in six stages. Each stage is one course objective; the weeks of the course walk the line left to right. Six stages left to right: Prepare (CO1): clean, transform, integrate, document. Home weeks 1, 2, 3; returns in weeks 5. Analyze (CO2): describe, visualize, find anomalies. Home weeks 2, 3, 4. Select methods (CO3): match the method to the question. Home weeks 5, 6. Model (CO4): estimate likelihood, severity, drivers. Home weeks 7, 8. Validate and evaluate (CO5): uncertainty, performance, bias, limits. Home weeks 8, 9; returns in weeks 3, 4. Communicate (CO6): reproducible analyses, dashboards, briefs. Home weeks 10; practised every week (weeks 1 to 9). Solid marks are home weeks; light marks with a ring are weeks the stage returns; the underline marks a stage practised every week.</desc>
<style>
    .head { font-family: Campton, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
    .body { font-family: 'Akkurat Pro', Akkurat, Helvetica, Arial, sans-serif; font-weight: 400; }
    .bold { font-family: 'Akkurat Pro', Akkurat, Helvetica, Arial, sans-serif; font-weight: 700; }
</style>
